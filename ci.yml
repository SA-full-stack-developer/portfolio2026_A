name: CI + Deploy

on:
  push:
    branches:
      - develop
      - 'feature/**'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clear npm cache
        run: npm cache clean --force
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Use production manifest
        run: cp apps/portfolio/src/assets/federation.manifest.prod.json apps/portfolio/src/assets/federation.manifest.json
      - name: Build frontend
        env:
          NODE_ENV: production
          APP_PRERENDER: 'true'
        run: npx nx build portfolio --configuration production
      - name: Inject font preloads
        run: node scripts/inject-font-preloads.mjs
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/portfolio/

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/frontend-dist/
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Push frontend to deploy branch
        run: |
          git checkout deploy
          git rm -rf . --quiet
          cp -r /tmp/frontend-dist/browser/. .
          mkdir -p server
          cp -r /tmp/frontend-dist/server/. server/
      - name: Copy htaccess
        run: |
          cp /tmp/frontend-dist/browser/.htaccess . 2>/dev/null || true    
          git add .
          git commit -m "deploy: frontend $(date +'%Y-%m-%d %H:%M:%S')" || echo "Nothing to commit"
          git push origin deploy
