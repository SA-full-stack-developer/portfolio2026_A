name: CI + Deploy

on:
  push:
    branches:
      - develop
      - 'feature/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check affected
        id: affected
        run: |
          AFFECTED=$(npx --yes nx affected:projects --base=origin/develop --head=HEAD 2>/dev/null || echo "")
          echo "projects=$AFFECTED" >> $GITHUB_OUTPUT
          echo "Affected projects: $AFFECTED"
      - name: Clear npm cache
        if: steps.affected.outputs.projects != ''
        run: npm cache clean --force
      - name: Install dependencies
        if: steps.affected.outputs.projects != ''
        run: npm ci --legacy-peer-deps
      - name: Lint
        if: steps.affected.outputs.projects != ''
        run: npx nx affected --target=lint --base=origin/develop --head=HEAD

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check affected
        id: affected
        run: |
          AFFECTED=$(npx --yes nx affected:projects --base=origin/develop --head=HEAD 2>/dev/null || echo "")
          echo "projects=$AFFECTED" >> $GITHUB_OUTPUT
          echo "Affected projects: $AFFECTED"
      - name: Clear npm cache
        if: steps.affected.outputs.projects != ''
        run: npm cache clean --force
      - name: Install dependencies
        if: steps.affected.outputs.projects != ''
        run: npm ci --legacy-peer-deps
      - name: Test
        if: steps.affected.outputs.projects != ''
        run: npx nx affected --target=test --base=origin/develop --head=HEAD

  build-frontend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clear npm cache
        run: npm cache clean --force
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Use production manifest
        run: cp apps/portfolio/src/assets/federation.manifest.prod.json apps/portfolio/src/assets/federation.manifest.json
      - name: Build frontend
        env:
          NODE_ENV: production
          APP_PRERENDER: 'true'
        run: npx nx build portfolio --configuration production
      - name: Inject font preloads
        run: node scripts/inject-font-preloads.mjs
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/portfolio/

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/frontend-dist/
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Push frontend to deploy branch
        run: |
          git checkout deploy
          git rm -rf . --quiet
          cp -r /tmp/frontend-dist/browser/. .
          mkdir -p server
          cp -r /tmp/frontend-dist/server/. server/
          git add .
          git commit -m "deploy: frontend $(date +'%Y-%m-%d %H:%M:%S')" || echo "Nothing to commit"
          git push origin deploy

  build-backend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build backend
        working-directory: apps/backend
        run: |
          npm ci
          npm run build
          npm ci --omit=dev
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            apps/backend/dist/
            apps/backend/package.json
            apps/backend/package-lock.json
            apps/backend/node_modules/

  deploy-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: /tmp/backend-dist/
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Push backend to deploy-api branch
        run: |
          git checkout deploy-api
          git rm -rf --ignore-unmatch . --quiet
          mkdir -p dist
          cp -r /tmp/backend-dist/dist/. dist/
          cp -r /tmp/backend-dist/node_modules/. node_modules/
          node -e "
            const pkg = require('/tmp/backend-dist/package.json');
            pkg.scripts = { start: 'node dist/main.js' };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          cat > ecosystem.config.js << 'EOF'
          module.exports = {
            apps: [
              {
                name: 'portfolio-backend',
                script: 'dist/main.js',
                env: {
                  NODE_ENV: 'production',
                  PORT: 3000,
                },
              },
            ],
          };
          EOF
          git add .
          git commit -m "deploy: backend $(date +'%Y-%m-%d %H:%M:%S')" || echo "Nothing to commit"
          git push origin deploy-api

  build-lab001:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clear npm cache
        run: npm cache clean --force
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build lab001
        run: npx nx build lab001 --configuration production
      - name: Upload lab001 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab001-dist
          path: dist/apps/lab001/browser/

  deploy-lab001:
    runs-on: ubuntu-latest
    needs: build-lab001
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Download lab001 artifact
        uses: actions/download-artifact@v4
        with:
          name: lab001-dist
          path: /tmp/lab001-dist/
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Push lab001 to deploy-lab1 branch
        run: |
          git checkout deploy-lab1
          git rm -rf . --quiet
          cp -r /tmp/lab001-dist/. .
          git add .
          git commit -m "deploy: lab001 $(date +'%Y-%m-%d %H:%M:%S')" || echo "Nothing to commit"
          git push origin deploy-lab1
