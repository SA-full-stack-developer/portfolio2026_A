name: CI + Deploy

on:
  push:
    branches:
      - develop
      - 'feature/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run test:ci

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Build frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build -- --configuration production
      - name: Build backend
        working-directory: backend
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/portfolio2026_A/
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/

  deploy-backend:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend-dist/
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2222 -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy backend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p 2222" \
            backend-dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/api.csrangulardeveloper.nom.es/
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -p 2222" \
            backend/package.json \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/api.csrangulardeveloper.nom.es/package.json

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2222 -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy frontend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p 2222" \
            frontend-dist/browser/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/csrangulardeveloper.nom.es/public/
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p 2222" \
            frontend-dist/server/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/csrangulardeveloper.nom.es/server/
      - name: Restart frontend app
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 2222 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "touch ~/csrangulardeveloper.nom.es/server/server.mjs"
