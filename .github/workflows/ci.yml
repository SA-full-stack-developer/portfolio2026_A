name: CI + Deploy

on:
  push:
    branches:
      - develop
      - 'feature/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run test:ci

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Build frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build -- --configuration production
      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/portfolio2026_A/
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist/
            backend/package.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/frontend-dist/
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: /tmp/backend-dist/
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Push frontend to deploy branch
        run: |
          git checkout deploy
          git rm -rf . --quiet
          cp -r /tmp/frontend-dist/browser/. .
          mkdir -p server
          cp -r /tmp/frontend-dist/server/. server/
          git add .
          git commit -m "deploy: frontend $(date +'%Y-%m-%d %H:%M:%S')" || echo "Nothing to commit"
          git push origin deploy

      - name: Push backend to deploy-api branch
        run: |
          git checkout deploy-api
          git rm -rf --ignore-unmatch . --quiet
          mkdir -p dist
          cp -r /tmp/backend-dist/dist/. dist/
          node -e "
            const pkg = require('/tmp/backend-dist/package.json');
            pkg.scripts = { start: 'node dist/main.js' };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          cat > ecosystem.config.js << 'EOF'
          module.exports = {
            apps: [
              {
                name: 'portfolio-backend',
                script: 'dist/main.js',
                env: {
                  NODE_ENV: 'production',
                  PORT: 3000,
                },
              },
            ],
          };
          EOF
          echo 'node_modules/' >> .gitignore
          git add .
          git commit -m "deploy: backend $(date +'%Y-%m-%d %H:%M:%S')" || echo "Nothing to commit"
          git push origin deploy-api
