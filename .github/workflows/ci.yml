name: Debug Frontend Build

on:
  push:
    branches:
      - develop
      - 'feature/**'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Debug lockfile
        run: |
          echo "--- node version ---"
          node --version
          echo "--- npm version ---"
          npm --version
          echo "--- pwd ---"
          pwd
          echo "--- packages in lockfile ---"
          node -e "console.log(Object.keys(require('./package-lock.json').packages).length)"
          echo "--- name in lockfile ---"
          node -e "console.log(require('./package-lock.json').name)"
          echo "--- .npmrc exists? ---"
          cat .npmrc 2>/dev/null || echo "NO .npmrc"
          echo "--- npm config list ---"
          npm config list
      - name: Clear npm cache
        run: npm cache clean --force
      - name: npm ci
        run: npm ci --legacy-peer-deps
      - name: Debug post-install
        run: |
          echo "--- node_modules count ---"
          ls node_modules | wc -l
          echo "--- nx exists? ---"
          ls node_modules/.bin/nx 2>/dev/null || echo "NO NX"
          echo "--- installed packages ---"
          npm ls --depth=0 2>/dev/null | head -20

  build-backend:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build backend
        working-directory: apps/backend
        run: |
          npm ci
          npm run build
