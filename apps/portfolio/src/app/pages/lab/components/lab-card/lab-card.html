<div class="lab-card">
  <div class="lab-card__tag">{{ tag() }}</div>
  <h3 class="lab-card__title">{{ title() }}</h3>
  <div class="lab-card__bar"></div>
  <div class="lab-card__content">
    @if (component()) {
      <ng-container
        [ngComponentOutlet]="component()"
        [ngComponentOutletInputs]="{ cssVars: cssVars() }"
      ></ng-container>
    } @else {
      TODO: skeleton loader
    }
  </div>
</div>
