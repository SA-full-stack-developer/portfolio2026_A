<div class="lab-card">
  <div class="lab-card__tag">{{ tag() }}</div>
  <a class="lab-card__title" [routerLink]="['/lab', id()]">{{ title() }}</a>
  <div class="lab-card__bar"></div>
  <div class="flex flex-center lab-card__content">
    @if (component()) {
      <ng-container
        [ngComponentOutlet]="component()"
        [ngComponentOutletInputs]="getInputs()"
      ></ng-container>
    } @else {
      TODO: skeleton loader
    }
  </div>
</div>
