<section class="contact-assistant">
  <div class="contact-assistant__header">
    <h2 class="contact-assistant__title">{{ 'AI.CONTACT_ASSISTANT.TITLE' | translate }}</h2>
    <p class="contact-assistant__subtitle">{{ 'AI.CONTACT_ASSISTANT.SUBTITLE' | translate }}</p>
  </div>

  <div class="contact-assistant__messages" #messagesContainer>
    @if (history().length === 0) {
      <div class="contact-assistant__empty">
        <p>{{ 'AI.CONTACT_ASSISTANT.PLACEHOLDER' | translate }}</p>
      </div>
    }
    @for (msg of history(); track $index) {
      <app-chat-message [message]="msg" />
    }
    @if (loading()) {
      <div class="contact-assistant__typing"><span></span><span></span><span></span></div>
    }
  </div>

  @if (error()) {
    <p class="contact-assistant__error">{{ error()! | translate }}</p>
  }

  <div class="contact-assistant__input-row">
    <textarea
      class="contact-assistant__textarea"
      [placeholder]="'AI.CONTACT_ASSISTANT.INPUT_PLACEHOLDER' | translate"
      [value]="inputText()"
      (input)="onInput($any($event.target).value)"
      (keydown)="onKeydown($event)"
      rows="1"
    ></textarea>
    <button
      class="contact-assistant__send"
      (click)="send()"
      [disabled]="loading() || !inputText().trim()"
      [attr.aria-label]="'AI.SEND' | translate"
    >
      <span class="material-icons">send</span>
    </button>
  </div>
</section>
