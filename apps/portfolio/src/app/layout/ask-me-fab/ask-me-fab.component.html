<div class="ask-me-fab">
  <div class="ask-me-fab__panel" #panel>
    <div class="ask-me-fab__panel-header">
      <span class="ask-me-fab__panel-title">{{ 'AI.ASK_ME.TITLE' | translate }}</span>
      <button
        class="ask-me-fab__close"
        (click)="toggle()"
        [attr.aria-label]="'AI.ASK_ME.CLOSE' | translate"
      >
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="ask-me-fab__messages" #messagesContainer>
      @if (history().length === 0) {
        <p class="ask-me-fab__empty">{{ 'AI.ASK_ME.PLACEHOLDER' | translate }}</p>
      }
      @for (msg of history(); track $index) {
        <div
          class="ask-me-fab__msg"
          [class.ask-me-fab__msg--user]="msg.role === 'user'"
          [class.ask-me-fab__msg--model]="msg.role === 'model'"
        >
          {{ msg.content }}
        </div>
      }
      @if (loading()) {
        <div class="ask-me-fab__typing"><span></span><span></span><span></span></div>
      }
    </div>

    @if (error()) {
      <p class="ask-me-fab__error">{{ error()! | translate }}</p>
    }

    <div class="ask-me-fab__input-row">
      <input
        class="ask-me-fab__input"
        type="text"
        [placeholder]="'AI.ASK_ME.INPUT_PLACEHOLDER' | translate"
        [value]="inputText()"
        (input)="onInput($any($event.target).value)"
        (keydown)="onKeydown($event)"
      />
      <button
        class="ask-me-fab__send"
        (click)="send()"
        [disabled]="loading() || !inputText().trim()"
      >
        <span class="material-icons">send</span>
      </button>
    </div>
  </div>

  <button
    class="ask-me-fab__btn"
    (click)="toggle()"
    [attr.aria-label]="'AI.ASK_ME.OPEN' | translate"
    [attr.aria-expanded]="isOpen()"
  >
    <span class="material-icons">{{ isOpen() ? 'close' : 'smart_toy' }}</span>
  </button>
</div>
